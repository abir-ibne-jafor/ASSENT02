<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Influencer Products</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-left">
            <img src="images/menu.png" alt="Menu" class="hamburger">
            <h2>Influencer products</h2>
        </div>
        <div class="nav-right">
            <div class="desktop-menu">
                <h6>Home</h6>
                <h6>Products</h6>
                <h6>Sign up</h6>
                <h6>Log In</h6>
                <img src="images/search.png" alt="Search" class="icon-nav">
                <img src="images/shopping-bag.png" alt="Cart" class="icon-nav">
            </div>
            <img src="images/shopping-bag.png" alt="Cart" class="icon-nav mobile-cart">
        </div>
    </nav>

    <!-- Banner Section -->
    <header>
        <section class="bannar">
            <div class="column text-col">
                <p class="bannar-title">Start your Journey as <br>Influencer</p>
                <p class="bannar-discription">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sem
                    vestibulum sed scelerisque eros. Lectus faucibus.
                </p>
                <button class="bannar-btn">
                    Preebook now <span class="arrow">➜</span>
                </button>
            </div>
            <div class="column img-col">
                <img src="images/main-camera.png" alt="Main Camera">
            </div>
        </section>

        <!-- Partner Brands -->
        <section class="brands">
            <img src="images/alibaba.png" alt="Alibaba">
            <img src="images/amazon.png" alt="Amazon">
            <img src="images/daraz.png" alt="Daraz">
            <img src="images/ebay.png" alt="eBay">
            <img src="images/rakuten.png" alt="Rakuten">
            <img src="images/walmart.png" alt="Walmart">
            <img src="images/target.png" alt="Target">
        </section>
    </header>
</body>

</html>
